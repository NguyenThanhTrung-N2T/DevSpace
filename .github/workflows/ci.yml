name: DevSpace CI

on:
  pull_request:
    branches:
      - main
      - 'phase/*'

jobs:
  build-auth-service:
    name: Build Auth Service (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore apps/auth-service/auth-service.csproj

      - name: Build Web API
        run: dotnet build apps/auth-service/auth-service.csproj --configuration Release --no-restore

  build-web-app:
    name: Build Web App (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Lint check
        run: |
          cd apps/web
          npm run lint

      - name: Build Next.js
        run: |
          cd apps/web
          npm run build
