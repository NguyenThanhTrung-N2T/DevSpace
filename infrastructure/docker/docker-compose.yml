version: "3.9"
 
services:
  postgres:
    image: postgres:16-alpine
    container_name: devspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devspace
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devspace -d devspace"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devspace-net]
 
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: devspace-auth
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=devspace;Username=devspace;Password=${POSTGRES_PASSWORD};SearchPath=auth"
      Jwt__PrivateKeyPath: /run/secrets/jwt_private_key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:8080"
    networks: [devspace-net]
 
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: devspace-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost/api
    depends_on: [auth-service]
    ports:
      - "3000:3000"
    networks: [devspace-net]
 
  nginx:
    image: nginx:alpine
    container_name: devspace-nginx
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, auth-service]
    ports:
      - "80:80"
    networks: [devspace-net]
 
volumes:
  postgres_data:
 
networks:
  devspace-net:
    driver: bridge
